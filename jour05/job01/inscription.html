<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Jour 05</title>
    <link rel="stylesheet" href="style_compte.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="page-inscription">
    <div class="container-standalone registration-full">
        <section class="registration-section">
            <div class="benefit-sidebar">
                <h2 class="header-dark">INSCRIPTION</h2>
            </div>
            
            <div class="registration-form-container">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prenom">Prénom:</label>
                            <input type="text" id="prenom" placeholder="Votre prénom">
                            <span id="prenomError" class="error"></span>
                        </div>
                        <div class="form-group">
                            <label for="nom">Nom:</label>
                            <input type="text" id="nom" placeholder="Votre nom">
                            <span id="nomError" class="error"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="text" id="email" placeholder="votre@email.com">
                        <span id="emailError" class="error"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Mot de passe:</label>
                            <input type="password" id="password" placeholder="••••••••">
                            <span id="passwordError" class="error"></span>
                        </div>
                        <div class="form-group">
                            <label for="passwordConfirm">Confirmation:</label>
                            <input type="password" id="passwordConfirm" placeholder="••••••••">
                            <span id="passwordConfirmError" class="error"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn-dark-full">S'INSCRIRE</button>
                    <p class="switch-link">Déjà inscrit ? <a href="connexion.html">Connectez-vous</a></p>
                </form>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
